[project]
name = "local_coder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sarawut Ponsan", email = "122785047+ssrpsx@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
coder = "local_coder.cli:app"
local-cli-coder = "local_coder:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
